name: build

# fork miuiadmin/speedcat-client —— Android-only + secrets-free(裁自上游 4 平台 build.yaml)。
# 产物:Bettbox-<v>-android-<abi>.apk(debug-signed sideloadable;asset 名留 Bettbox 因 in-app
# 更新器 controller.dart:1012 硬编码 Bettbox- 前缀,改 Speedcat- 会断更新器)。
# v* tag → Release;workflow_dispatch → 仅出 CI artifacts 手测(不发 Release,见 Release 步 tag guard)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ !contains(github.ref, '-') || contains(github.ref_name, 'pre') }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            arch: arm64
          - platform: android
            os: ubuntu-24.04
            arch: amd64
          - platform: android
            os: ubuntu-24.04
            arch: arm
          - platform: android
            os: ubuntu-24.04
            arch: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      # 无 Setup Keystore 步 → android/app/keystore.jks 不存在 → build.gradle.kts isRelease=false
      # → release buildType 回退 debug 签名 → debug-signed APK(sideloadable,非 Play-Store)。
      # 将来加 release 签名:回加 4 secret(KEYSTORE/KEY_ALIAS/STORE_PASSWORD/KEY_PASSWORD)+ 本步。

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.compatible == true && '1.20.x' || '1.25.x' }}
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ contains(matrix.os, 'arm') && 'master' || 'stable' }}
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ contains(matrix.os, 'arm') && '' || '3.44.6' }}

      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      # 内部:go build -buildmode=c-shared → libclash.so(含 speedcat)→ copyNativeLibs → CMake libcore.so → flutter build apk
      - name: Build (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build -d
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Bettbox-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}
          path: ./dist
          compression-level: 9
          overwrite: true

  upload:
    permissions: write-all
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: Bettbox-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          echo -e "- Fixes and improvements\n- 具体变更参考最新Commits" > release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          base_version=$(echo "$version" | sed 's/-pre[0-9]*//')
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template_pre.md >> release.md
          else
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          fi

      # tag guard:workflow_dispatch(branch)时 SHOULD_RELEASE 也为 true(refs/heads/main 无 '-'),
      # 但非 tag 不应发 Release → 显式要求 refs/tags/ 才发。冒烟 dispatch 只留 CI artifacts。
      - name: Release
        if: ${{ env.SHOULD_RELEASE == 'true' && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
